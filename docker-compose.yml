version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatnex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatnex
      POSTGRES_USER: chatnex
      POSTGRES_PASSWORD: chatnex_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - chatnex-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatnex-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://chatnex:chatnex_password@postgres:5432/chatnex
      JWT_SECRET: change-this-super-secret-key-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - chatnex-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatnex-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - chatnex-net

volumes:
  postgres_data:

networks:
  chatnex-net:
    driver: bridge
